[project]
name = "office365-unified-mcp"
version = "0.0.1"
description = "Unified Microsoft 365 MCP server — Mail, Calendar, OneDrive, SharePoint, Contacts, Teams, To Do, binary attachment download, delta sync, and batch triage via Microsoft Graph API"
readme = "README.md"
authors = [
    { name = "Guilherme Inácio", email = "gsilvainacio@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Capped below the next major: this repo reaches into fastmcp internals
    # that are not covered by semver guarantees — private helpers in
    # fastmcp.apps.file_upload (_b64_decoded_size/_make_summary/_TEXT_EXTENSIONS,
    # see uploads.py), NotFoundError being raised inside call_next during tool
    # dispatch (middleware.MetricsMiddleware), and the MultiAuth/AzureProvider
    # composition shape (identity._find_azure_provider). Re-verify those seams
    # before raising the cap.
    "fastmcp[azure,apps]>=3.4.4,<4",
    "msal>=1.28",
    "msal-extensions>=1.2",
    "httpx>=0.27",
    "aiohttp>=3.10,<4",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
mcp-microsoft = "mcp_microsoft.server:main"
office365-unified-mcp = "mcp_microsoft.server:main"
mcp-microsoft-setup = "mcp_microsoft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
]

[tool.uv]
constraint-dependencies = [
    "pydantic-settings>=2.14.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
